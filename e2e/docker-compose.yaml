# End-to-end environment: the o11y-bench observability stack (Grafana 13 + Prometheus, Loki, Tempo
# with seeded incident data) plus the Augur plugins built into ../augur-*/dist, and a scripted
# stub model. Used by e2e/run.sh and CI; no model key needed.
#
# O11Y_BENCH_DIR must point at a checkout of github.com/grafana/o11y-bench (run.sh clones it).
services:
  stack:
    build: ${O11Y_BENCH_DIR:?set O11Y_BENCH_DIR}/docker
    ports:
      - '3000:3000'
    environment:
      O11Y_SCENARIO_TIME_ISO: ${O11Y_SCENARIO_TIME_ISO:-}
      GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS: augur-assistant-app,augur-claude-datasource
    volumes:
      - ../augur-app/dist:/var/lib/grafana/plugins/augur-assistant-app:ro
      - ../augur-datasource/dist:/var/lib/grafana/plugins/augur-claude-datasource:ro
      - ./provisioning/datasources/augur.yaml:/etc/grafana/provisioning/datasources/augur.yaml:ro
      - ./provisioning/plugins/augur.yaml:/etc/grafana/provisioning/plugins/augur.yaml:ro
    healthcheck:
      test: ['CMD', 'curl', '-sf', 'http://localhost:8080/']
      interval: 2s
      retries: 150
  stub:
    image: node:22-alpine
    command: ['node', '/e2e/stub-model.mjs', '/e2e/scenarios/smoke.json', '8787']
    ports:
      - '8787:8787'
    volumes:
      - ./:/e2e:ro
