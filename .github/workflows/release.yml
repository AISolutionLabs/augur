name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: augur-app/.nvmrc
      - uses: actions/setup-go@v5
        with:
          go-version-file: augur-datasource/go.mod
      - run: go install github.com/magefile/mage@latest
      - run: make install test package
      # Optional: sign with a Grafana access policy token (set GRAFANA_ACCESS_POLICY_TOKEN and uncomment)
      # - run: |
      #     cd augur-app && npx @grafana/sign-plugin@latest --distDir dist
      #     cd ../augur-datasource && npx @grafana/sign-plugin@latest --distDir dist
      #   env:
      #     GRAFANA_ACCESS_POLICY_TOKEN: ${{ secrets.GRAFANA_ACCESS_POLICY_TOKEN }}
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.zip
            release/SHA256SUMS
          generate_release_notes: true
