name: Release

# Two ways to release:
#  1. Push a tag:            git tag v1.2.0 && git push origin v1.2.0
#  2. Actions → Release → "Run workflow" with a version: bumps both plugins, commits, tags and releases.
# Versions with a pre-release suffix (e.g. 1.2.0-rc.1) are published as GitHub pre-releases.
#
# Optional configuration (Settings → Secrets and variables → Actions):
#  - secret   GRAFANA_ACCESS_POLICY_TOKEN  sign the plugins (token with plugins:write scope from grafana.com)
#  - variable GRAFANA_SIGN_ROOT_URLS       comma-separated Grafana URLs for a *private* signature
#                                          (omit for community signing, which needs the augur- org on grafana.com)

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 1.2.0 or 1.2.0-rc.1 (no "v")'
        required: true
        type: string
      draft:
        description: 'Create the GitHub release as a draft'
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare version
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: augur-app/.nvmrc

      - name: Resolve version
        id: v
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            VERSION="${INPUT_VERSION#v}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$VERSION' is not a valid semver version"; exit 1
          fi
          PRERELEASE=false
          [[ "$VERSION" == *-* ]] && PRERELEASE=true
          {
            echo "version=$VERSION"
            echo "tag=v$VERSION"
            echo "prerelease=$PRERELEASE"
          } >> "$GITHUB_OUTPUT"

      - name: Bump, commit and tag (manual runs)
        if: github.event_name == 'workflow_dispatch'
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "::error::Tag v$VERSION already exists"; exit 1
          fi
          scripts/set-version.sh "$VERSION"
          if ! grep -q "^## $VERSION" augur-app/CHANGELOG.md; then
            echo "::warning::augur-app/CHANGELOG.md has no '## $VERSION' section; release notes will only list commits"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add augur-app/package.json augur-app/package-lock.json augur-datasource/package.json augur-datasource/package-lock.json
          git diff --cached --quiet || git commit -m "Release v$VERSION"
          git tag -a "v$VERSION" -m "Augur v$VERSION"
          git push origin "HEAD:${GITHUB_REF_NAME}" "v$VERSION"

  build:
    name: Build, test and package
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      GRAFANA_ACCESS_POLICY_TOKEN: ${{ secrets.GRAFANA_ACCESS_POLICY_TOKEN }}
      GRAFANA_SIGN_ROOT_URLS: ${{ vars.GRAFANA_SIGN_ROOT_URLS }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: augur-app/.nvmrc
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: augur-datasource/go.mod
          cache-dependency-path: augur-datasource/go.sum
      - name: Install mage
        run: go install github.com/magefile/mage@v1.17.2

      - name: Align plugin versions with the tag
        run: scripts/set-version.sh "$VERSION"

      - name: Install
        run: make install
      - name: Lint and type-check
        run: make lint
      - name: Test
        run: make test
      - name: Grafana 12.0 compatibility
        run: make compat
      - name: Build frontends and backends
        run: make build

      - name: Sign plugins
        if: env.GRAFANA_ACCESS_POLICY_TOKEN != ''
        run: |
          ARGS=()
          if [ -n "$GRAFANA_SIGN_ROOT_URLS" ]; then ARGS=(--rootUrls "$GRAFANA_SIGN_ROOT_URLS"); fi
          (cd augur-app && npx --yes @grafana/sign-plugin@latest --distDir dist "${ARGS[@]}")
          (cd augur-datasource && npx --yes @grafana/sign-plugin@latest --distDir dist "${ARGS[@]}")
      - name: Note unsigned build
        if: env.GRAFANA_ACCESS_POLICY_TOKEN == ''
        run: echo "::notice::GRAFANA_ACCESS_POLICY_TOKEN not set; publishing unsigned plugins"

      - name: Package
        run: make zip VERSION="$VERSION"

      - name: Check archive layout
        run: |
          for z in release/*.zip; do
            id=$(basename "$z" | sed -E "s/-$VERSION\.zip$//")
            unzip -l "$z" | grep -q " $id/plugin.json$" || { echo "::error::$z is missing $id/plugin.json"; exit 1; }
            v=$(unzip -p "$z" "$id/plugin.json" | node -p "JSON.parse(require('fs').readFileSync(0)).info.version")
            [ "$v" = "$VERSION" ] || { echo "::error::$id plugin.json version $v != $VERSION"; exit 1; }
          done
          unzip -l "release/augur-claude-datasource-$VERSION.zip" | grep -q gpx_augur_linux_amd64 || { echo "::error::backend binary missing"; exit 1; }

      - name: Validate with Grafana plugin validator (advisory)
        continue-on-error: true
        run: |
          for z in release/*.zip; do
            docker run --rm -v "$PWD/release:/release" grafana/plugin-validator-cli "/release/$(basename "$z")" || true
          done

      - name: Release notes
        run: scripts/release-notes.sh "$VERSION" > release/NOTES.md

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ env.VERSION }}
          path: release/
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-${{ needs.prepare.outputs.version }}
          path: release

      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: release/*.zip

      - name: Create release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: Augur ${{ needs.prepare.outputs.tag }}
          body_path: release/NOTES.md
          generate_release_notes: true
          prerelease: ${{ needs.prepare.outputs.prerelease == 'true' }}
          draft: ${{ inputs.draft == true }}
          fail_on_unmatched_files: true
          files: |
            release/augur-assistant-app-${{ needs.prepare.outputs.version }}.zip
            release/augur-claude-datasource-${{ needs.prepare.outputs.version }}.zip
            release/SHA256SUMS
