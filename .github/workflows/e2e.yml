name: E2E

# Real Grafana 13 + Prometheus/Loki/Tempo (o11y-bench stack with seeded incident data), the Augur
# plugins built from this commit, and a scripted stub model. Headless runs (model direct and
# through the Augur datasource backend) and a browser run of the app page.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: augur-app/.nvmrc
      - uses: actions/setup-go@v5
        with:
          go-version-file: augur-datasource/go.mod
          cache-dependency-path: augur-datasource/go.sum
      - name: Build app and headless runner
        working-directory: augur-app
        run: npm ci && npm run build && npm run build:headless
      - name: Build datasource
        working-directory: augur-datasource
        run: npm ci && npm run build
      - name: Build datasource backend (linux/amd64)
        uses: magefile/mage-action@v3
        with:
          version: latest
          args: -v build:linux
          workdir: augur-datasource
      - name: Summary header
        run: |
          {
            echo "### React #185 update loops (probe)"
            echo "| Arm | Passes | Grafana-only loops | Result |"
            echo "|---|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Run e2e
        env:
          CHROME_PATH: /usr/bin/google-chrome
          SCREENSHOT: ${{ github.workspace }}/e2e/e2e-ui.png
          # Repeat the browser pass to surface intermittent UI errors (each ~30s).
          E2E_UI_RUNS: '5'
        run: |
          set -o pipefail
          e2e/run.sh 2>&1 | tee e2e/e2e.log
      - name: Demo compose (deploy/) loads the plugins
        run: |
          docker compose -f deploy/docker-compose.yaml up -d
          for _ in $(seq 1 90); do
            if curl -sf http://localhost:3000/api/plugins/augur-assistant-app/settings | grep -q '"enabled":true' &&
               curl -sf http://localhost:3000/api/datasources/uid/claude | grep -q augur-claude-datasource; then
              echo "✓ demo: Augur app enabled and Claude datasource provisioned"
              node e2e/nav-check.mjs root; exit $?
            fi
            sleep 2
          done
          echo "✗ demo: plugins not loaded"; docker compose -f deploy/docker-compose.yaml logs --tail 150; exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-artifacts
          path: |
            e2e/e2e-ui.png
            e2e/e2e.log
            e2e/artifacts/
          if-no-files-found: ignore

  # Control experiment for the intermittent React #185 in Grafana 13's chrome: the same Grafana
  # stack browsed without Augur, and with Augur installed but idle. Reports only; never fails.
  loop-control:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CHROME_PATH: /usr/bin/google-chrome
      O11Y_BENCH_DIR: ${{ github.workspace }}/e2e/.o11y-bench
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: augur-app/.nvmrc
      - uses: actions/setup-go@v5
        with:
          go-version-file: augur-datasource/go.mod
          cache-dependency-path: augur-datasource/go.sum
      - name: Build plugins
        run: |
          (cd augur-app && npm ci && npm run build)
          (cd augur-datasource && npm ci && npm run build)
      - uses: magefile/mage-action@v3
        with:
          version: latest
          args: -v build:linux
          workdir: augur-datasource
      - name: Prepare
        working-directory: e2e
        run: |
          git clone -q https://github.com/grafana/o11y-bench "$O11Y_BENCH_DIR"
          git -C "$O11Y_BENCH_DIR" checkout -q "$(cat o11y-bench.ref)"
          npm ci --ignore-scripts
          {
            echo "### React #185 control experiment"
            echo "| Arm | Passes | Update loops | Result |"
            echo "|---|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Without Augur
        working-directory: e2e
        run: |
          set -o pipefail
          export O11Y_SCENARIO_TIME_ISO=$(date -u +%Y-%m-%dT%H:%M:00Z)
          docker compose -f docker-compose.control.yaml up -d --build --wait
          CONTROL_LABEL="Without Augur (Grafana pages)" node control.mjs 2>&1 | tee -a control.log
          docker compose -f docker-compose.control.yaml down -v
      - name: Augur installed, idle
        working-directory: e2e
        run: |
          set -o pipefail
          export O11Y_SCENARIO_TIME_ISO=$(date -u +%Y-%m-%dT%H:%M:00Z)
          mkdir -p artifacts
          docker compose up -d --build --wait
          CONTROL_LABEL="Augur installed, idle (Grafana pages)" node control.mjs 2>&1 | tee -a control.log
          CONTROL_LABEL="Augur page open, no chat" CONTROL_PAGES=/a/augur-assistant-app CONTROL_DWELL_MS=30000 node control.mjs 2>&1 | tee -a control.log
          docker compose down -v
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: control-log
          path: e2e/control.log
          if-no-files-found: ignore

  # Publishes a short text summary of this run to the ci-results branch (results/<sha>.md and
  # latest.md), readable with plain git where the Actions UI/API is not available.
  report:
    if: always() && github.event_name != 'pull_request'
    needs: [e2e, loop-control]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: logs
      - name: Write summary
        env:
          E2E: ${{ needs.e2e.result }}
          CONTROL: ${{ needs.loop-control.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "# E2E ${GITHUB_SHA::7} ($(date -u +%FT%TZ))"
            echo "run: $RUN_URL"
            echo "e2e: $E2E"
            echo "loop-control: $CONTROL"
            echo
            echo "## e2e"
            grep -hE '✓|✗|⚠|CONTROL RESULT|All .*passed|failed|loop:|error' logs/e2e-artifacts/e2e.log 2>/dev/null | grep -v '^\s*at ' | head -150 || echo "(no log)"
            echo
            echo "## loop-control"
            grep -hE '⚠|CONTROL RESULT|page error|loop' logs/control-log/control.log 2>/dev/null | head -60 || echo "(no log)"
            echo
            echo "## e2e failure diagnostics (tail)"
            [ "$E2E" = success ] || tail -n 80 logs/e2e-artifacts/e2e.log 2>/dev/null
          } > summary.md
          cat summary.md
      - name: Publish to ci-results branch
        run: |
          git init -q pub && cd pub
          git config user.name "augur-ci" && git config user.email "augur-ci@users.noreply.github.com"
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          if git fetch -q --depth 1 origin ci-results; then git checkout -q -b ci-results FETCH_HEAD; else git checkout -q --orphan ci-results; fi
          mkdir -p results
          cp ../summary.md "results/${GITHUB_SHA}.md"
          cp ../summary.md latest.md
          git add -A && git commit -qm "E2E results for ${GITHUB_SHA::7}" && git push -q origin ci-results
