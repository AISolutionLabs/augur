name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: augur-app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: augur-app/.nvmrc
          cache: npm
          cache-dependency-path: augur-app/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx eslint src
      - run: npx jest --ci
      - run: npm run build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: augur-assistant-app
          path: augur-app/dist

  datasource:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: augur-datasource
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: augur-datasource/.nvmrc
          cache: npm
          cache-dependency-path: augur-datasource/package-lock.json
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: augur-datasource/go.mod
          cache-dependency-path: augur-datasource/go.sum
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx eslint src
      - run: npm run build
      - run: go vet ./...
      - run: go test ./...
      - name: Build backend for all platforms
        uses: magefile/mage-action@6f50bbb8ea47d56e62dee92392788acbc8192d0b # v3.1.0
        with:
          version: latest
          args: -v buildAll
          workdir: augur-datasource
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: augur-claude-datasource
          path: augur-datasource/dist

  grafana12-compat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: augur-app/.nvmrc
      - run: scripts/check-grafana12.sh
