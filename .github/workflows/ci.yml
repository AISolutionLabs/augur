name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: augur-app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: augur-app/.nvmrc
          cache: npm
          cache-dependency-path: augur-app/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx eslint src
      - run: npx jest --ci
      - run: npm run build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: augur-assistant-app
          path: augur-app/dist

  datasource:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: augur-datasource
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: augur-datasource/.nvmrc
          cache: npm
          cache-dependency-path: augur-datasource/package-lock.json
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: augur-datasource/go.mod
          cache-dependency-path: augur-datasource/go.sum
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx eslint src
      - run: npm run build
      - run: go vet ./...
      - run: go test ./...
      - name: Build backend for all platforms
        uses: magefile/mage-action@a662bd8c29d8106879588cfff83b2faf6e6f59db # v4.0.0
        with:
          version: latest
          args: -v buildAll
          workdir: augur-datasource
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: augur-claude-datasource
          path: augur-datasource/dist

  grafana12-compat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: augur-app/.nvmrc
      - run: scripts/check-grafana12.sh
